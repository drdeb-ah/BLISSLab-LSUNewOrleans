title: Home
---

<style>
  .nav { display: flex; gap: 1.5rem; margin-bottom: 2rem; }
  .nav a { text-decoration: none; font-weight: bold; }
  .section { margin: 3rem 0; padding: 1.5rem; border: 1px solid #ddd; border-radius: 12px; }
  .section .icon { font-size: 2rem; margin-bottom: 0.5rem; }
  #guestbook { list-style: none; padding: 0; margin-top: 1rem; }
  #guestbook li { padding: 0.5rem 0; border-bottom: 1px dashed #ddd; }
  #guestbook small { color: #888; margin-left: 0.5rem; }
  .flying-star {
    position: fixed; top: 10%; left: -50px; font-size: 2.5rem; color: gold;
    pointer-events: none; z-index: 9999; animation: fly 1.8s ease-in forwards;
  }
  @keyframes fly {
    to { transform: translate(110vw, 50vh) rotate(360deg); opacity: 0; }
  }
</style>

<nav class="nav">
  <a href="{{ '/' | relative_url }}">Home</a>
  <a href="{{ '/research.html' | relative_url }}">Research Projects</a>
</nav>

<h1>Welcome to Dr. Deb's {{ site.title }}</h1>
<p>{{ site.description }}</p>

<div class="section">
  <div class="icon">★</div>
  <p>Share a little sprinkle of the "good stuff": click to send a shooting star to everyone on the page.</p>
  <button id="star-btn">shooting star!</button>
</div>

<div class="section">
  <div class="icon">⚓︎ ⌚︎</div>
  <p>Look at this empty box, filled with possiblity...</p>
</div>

<p id="ph-status" style="color:#888; font-size:0.85rem;">connecting…</p>

  <script type="module">
    import { playhtml, html } from "playhtml";
    await playhtml.init({
      developmentMode: true,
      cursors: { enabled: true, room: "page" },
    });

    window.playhtml = playhtml;

    function shootStar() {
      window.playhtml.dispatchPlayEvent({ type: "shootingStar" });
    }
    window.shootStar = shootStar;

    window.playhtml.registerPlayEventListener("shootingStar", {
      onEvent: () => {
        document.getElementById("shootingStar").animate(
          [
            { transform: "translate(100vw, 100vh) rotate(0deg)" },
            { transform: "translate(-10vw, -10vh) rotate(360deg)" },
          ],
          { duration: 2000, fill: "forwards" }
        );
      },
    });
  </script>
</body>
</html>
